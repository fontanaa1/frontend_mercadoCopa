<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Mercado da Copa | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/api.js"></script>
  <script src="menu.js"></script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .tactile-active:active { transform: translate(2px, 2px); box-shadow: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { min-height: max(884px, 100dvh); font-family: 'Hanken Grotesk', sans-serif; }
    .product-card { transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .toast-message {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: #003215; color: white; padding: 12px 24px; border-radius: 50px;
      font-family: 'JetBrains Mono', monospace; font-size: 12px; z-index: 1001;
      animation: fadeInOut 3s ease-in-out; box-shadow: 4px 4px 0px 0px #fcd400;
      border: 1px solid #fcd400; white-space: nowrap;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#003215", "primary-container": "#004b23", "surface": "#f8f9fa",
            "outline": "#707970", "outline-variant": "#c0c9be", "on-surface": "#191c1d",
            "on-surface-variant": "#404941", "secondary-container": "#fcd400",
            "tertiary": "#5c000b", "background": "#f8f9fa", "secondary": "#705d00"
          },
          fontFamily: { "label-caps": ["JetBrains Mono"], "body-lg": ["Hanken Grotesk"] }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-surface min-h-screen pb-24">

  <header class="bg-surface w-full top-0 sticky z-50 border-b-2 border-outline-variant">
    <div class="flex justify-between items-center px-4 py-3 w-full">
      <div class="flex items-center gap-4">
        <button id="menuBtn" class="text-primary" onclick="window.openSidebar()">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h1 class="font-['Anton'] text-2xl text-primary tracking-tight">Mercado da Copa</h1>
      </div>
      <div class="flex items-center gap-4">
        <button id="logoutBtn" class="text-error text-sm font-bold hidden">Sair</button>
        <a href="carrinho.html" class="relative">
          <span class="material-symbols-outlined text-primary">shopping_cart</span>
          <span id="cartBadge" class="absolute -top-2 -right-2 bg-tertiary text-white text-xs rounded-full px-1.5 hidden">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto md:max-w-7xl md:px-4">
    <section class="px-4 py-4 bg-primary-container/10 border-b-2 border-outline-variant">
      <input id="searchInput" class="w-full h-12 bg-surface border-b-2 border-primary focus:border-secondary transition-all px-4" placeholder="Buscar raridades vintage..." type="text"/>
    </section>

    <section class="py-4">
      <div class="flex overflow-x-auto no-scrollbar gap-3 px-4">
        <button data-categoria="todos" class="categoria-btn active bg-primary text-on-primary px-4 py-2 border-2 border-primary font-label-caps text-xs">TODOS</button>
        <button data-categoria="camisas" class="categoria-btn px-4 py-2 border-2 border-outline text-on-surface-variant font-label-caps text-xs">CAMISAS</button>
        <button data-categoria="bones" class="categoria-btn px-4 py-2 border-2 border-outline text-on-surface-variant font-label-caps text-xs">BONÉS</button>
        <button data-categoria="casacos" class="categoria-btn px-4 py-2 border-2 border-outline text-on-surface-variant font-label-caps text-xs">CASACOS</button>
        <button data-categoria="chuteiras" class="categoria-btn px-4 py-2 border-2 border-outline text-on-surface-variant font-label-caps text-xs">CHUTEIRAS</button>
        <button data-categoria="bolas" class="categoria-btn px-4 py-2 border-2 border-outline text-on-surface-variant font-label-caps text-xs">BOLAS</button>
        <button data-categoria="acessorios" class="categoria-btn px-4 py-2 border-2 border-outline text-on-surface-variant font-label-caps text-xs">ACESSÓRIOS</button>
      </div>
    </section>

    <div class="px-4 mb-4 flex justify-between items-center">
      <h2 class="font-['Anton'] text-2xl text-primary tracking-tight">ARQUIVO HISTÓRICO</h2>
      <button id="clearFiltersBtn" class="font-label-caps text-xs text-secondary underline">LIMPAR FILTROS</button>
    </div>

    <div id="productsGrid" class="px-4 pb-8 grid grid-cols-2 gap-3 md:grid-cols-4">
      <div class="col-span-2 text-center py-10 text-on-surface-variant">📦 Carregando produtos...</div>
    </div>

    <div id="noResultsMessage" class="hidden px-4 py-10 text-center">
      <span class="material-symbols-outlined text-6xl text-outline-variant">search_off</span>
      <h3 class="font-['Anton'] text-xl text-primary">Nenhum item encontrado</h3>
    </div>
  </main>

  <nav class="fixed bottom-0 w-full z-50 bg-surface border-t-2 border-outline-variant">
    <div class="flex justify-around items-center py-2">
      <a href="telaprincipal.html" class="flex flex-col items-center bg-primary-container text-on-primary-container rounded-xl p-2"><span class="material-symbols-outlined" style="font-variation-settings:'FILL'1;">home</span><span class="font-label-caps text-xs mt-1">Home</span></a>
      <a href="publicaritens.html" class="flex flex-col items-center text-on-surface-variant p-2"><span class="material-symbols-outlined">add_circle</span><span class="font-label-caps text-xs mt-1">Sell</span></a>
      <a href="carrinho.html" class="flex flex-col items-center text-on-surface-variant p-2"><span class="material-symbols-outlined">shopping_cart</span><span class="font-label-caps text-xs mt-1">Cart</span></a>
      <a href="perfil.html" class="flex flex-col items-center text-on-surface-variant p-2"><span class="material-symbols-outlined">person</span><span class="font-label-caps text-xs mt-1">Profile</span></a>
    </div>
  </nav>

  <script type="module">
    import { carregarProdutos, getCarrinho, isAuthenticated, logout as apiLogout, loadSession } from './js/api.js';

    let currentCategory = "todos";
    let currentSearch = "";
    let produtos = [];

    const SUPABASE_URL = "https://xexduljwqxswwyplonvg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhleGR1bGp3cXhzd3d5cGxvbnZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMzY0ODYsImV4cCI6MjA5NjgxMjQ4Nn0.WoqAjML1Lp5Gqh2tpjX2VkMy11Zt_NfWcuVJPWUVr50";

    let supabaseClient = null;
    let realtimeChannel = null;

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast-message';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function loadAuth() {
      if (loadSession()) {
        document.getElementById('logoutBtn')?.classList.remove('hidden');
      }
    }

    async function loadCartBadge() {
      if (!isAuthenticated()) return;
      const carrinho = await getCarrinho();
      if (carrinho && carrinho.itens && carrinho.itens.length > 0) {
        const total = carrinho.itens.reduce((sum, i) => sum + i.quantidade, 0);
        const badge = document.getElementById('cartBadge');
        if (badge) {
          badge.textContent = total;
          badge.classList.remove('hidden');
        }
      }
    }

    async function loadProducts() {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = '<div class="col-span-2 text-center py-10 text-on-surface-variant">📦 Carregando produtos...</div>';
      
      try {
        const data = await carregarProdutos();
        if (data.error) {
          grid.innerHTML = `<div class="col-span-2 text-center py-10 text-red-600">❌ Erro: ${data.error}</div>`;
          return;
        }
        produtos = data;
        renderProducts();
      } catch (err) {
        grid.innerHTML = `<div class="col-span-2 text-center py-10 text-red-600">❌ Erro ao carregar produtos</div>`;
      }
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      const noResults = document.getElementById("noResultsMessage");
      
      let filtered = [...produtos];
      if (currentCategory !== "todos") {
        filtered = filtered.filter(p => p.categoria === currentCategory);
      }
      if (currentSearch.trim()) {
        const searchLower = currentSearch.toLowerCase();
        filtered = filtered.filter(p => p.titulo.toLowerCase().includes(searchLower));
      }
      
      if (filtered.length === 0) {
        grid.classList.add("hidden");
        noResults.classList.remove("hidden");
        return;
      }
      
      grid.classList.remove("hidden");
      noResults.classList.add("hidden");
      
      grid.innerHTML = filtered.map(produto => {
        const badge = produto.tipo_oferta === 'troca' ? 'ACEITA TROCA' : (produto.tipo_oferta === 'ambos' ? 'VENDA/TROCA' : 'VENDA');
        const badgeColor = produto.tipo_oferta === 'troca' ? 'bg-secondary-container text-on-secondary-container' : 'bg-primary-container text-on-primary-container';
        const vendedorNome = produto.usuario?.raw_user_meta_data?.nome || produto.usuario?.email?.split('@')[0] || 'Vendedor';
        return `
          <div class="product-card bg-surface border border-outline-variant rounded-lg overflow-hidden" onclick="window.location.href='detalhesproduto.html?id=${produto.id}'">
            <div class="relative aspect-[3/4] bg-gray-100">
              <img class="w-full h-full object-cover" src="${produto.imagem_url || 'https://placehold.co/400x500/e0e0e0/333?text=Imagem'}" alt="${produto.titulo}" onerror="this.src='https://placehold.co/400x500/e0e0e0/333?text=Imagem'">
              <div class="absolute top-2 left-2">
                <span class="${badgeColor} px-2 py-1 font-label-caps text-[10px] border border-secondary rounded flex items-center gap-1">
                  <span class="material-symbols-outlined text-[12px]">${produto.tipo_oferta === 'troca' ? 'swap_horiz' : 'sell'}</span> ${badge}
                </span>
              </div>
              <div class="absolute bottom-2 left-2 bg-black/70 text-white px-2 py-1 font-bold text-sm">
                R$ ${produto.preco}
              </div>
            </div>
            <div class="p-2">
              <h3 class="font-bold text-sm">${produto.titulo}</h3>
              <p class="text-xs text-gray-500">${vendedorNome} • Tam ${produto.tamanho || 'Único'}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    function setupRealtime() {
      if (!supabaseClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      if (realtimeChannel) {
        realtimeChannel.unsubscribe();
      }
      realtimeChannel = supabaseClient
        .channel('produtos-changes')
        .on('postgres_changes', { 
          event: '*', 
          schema: 'public', 
          table: 'produtos' 
        }, (payload) => {
          console.log('Realtime update:', payload);
          loadProducts();
          showToast('🔄 Novos itens disponíveis!');
        })
        .subscribe();
    }

    function setupEventListeners() {
      document.querySelectorAll('.categoria-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.categoria-btn').forEach(b => {
            b.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
            b.classList.add('border-outline', 'text-on-surface-variant');
          });
          btn.classList.add('bg-primary', 'text-on-primary', 'border-primary');
          currentCategory = btn.dataset.categoria;
          renderProducts();
        });
      });
      
      document.getElementById('searchInput')?.addEventListener('input', (e) => {
        currentSearch = e.target.value;
        renderProducts();
      });
      
      document.getElementById('clearFiltersBtn')?.addEventListener('click', () => {
        currentCategory = 'todos';
        currentSearch = '';
        document.getElementById('searchInput').value = '';
        document.querySelectorAll('.categoria-btn').forEach(b => {
          b.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
          b.classList.add('border-outline', 'text-on-surface-variant');
        });
        document.querySelector('.categoria-btn')?.classList.add('bg-primary', 'text-on-primary', 'border-primary');
        renderProducts();
      });
      
      document.getElementById('logoutBtn')?.addEventListener('click', async () => {
        await apiLogout();
        window.location.href = 'acesso.html';
      });
    }

    window.applyCategoryFilter = (categoria) => {
      currentCategory = categoria;
      document.querySelectorAll('.categoria-btn').forEach(btn => {
        if (btn.dataset.categoria === categoria) {
          btn.classList.add('bg-primary', 'text-on-primary', 'border-primary');
          btn.classList.remove('border-outline', 'text-on-surface-variant');
        } else {
          btn.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
          btn.classList.add('border-outline', 'text-on-surface-variant');
        }
      });
      renderProducts();
    };

    document.addEventListener('DOMContentLoaded', () => {
      loadAuth();
      loadProducts();
      loadCartBadge();
      setupEventListeners();
      setupRealtime();
      
      const pendingFilter = localStorage.getItem('pendingCategoryFilter');
      if (pendingFilter) {
        localStorage.removeItem('pendingCategoryFilter');
        applyCategoryFilter(pendingFilter);
      }
    });
  </script>
</body>
</html>
