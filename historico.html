<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - Mercado da Copa</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;700&family=JetBrains+Mono:wght@600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script type="module" src="./js/api.js"></script>
    <script src="menu.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .tactile-push:active {
            transform: translate(2px, 2px);
            box-shadow: none !important;
        }

        .neobrutal-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
        }

        body {
            min-height: max(884px, 100dvh);
            font-family: 'Hanken Grotesk', sans-serif;
        }

        .toast-message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #003215;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            z-index: 1001;
            animation: fadeInOut 3s ease-in-out;
            box-shadow: 4px 4px 0px 0px #fcd400;
            border: 1px solid #fcd400;
            white-space: nowrap;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error": "#ba1a1a", "on-primary-container": "#79bb87", "tertiary-fixed": "#ffdad7",
                        "on-secondary-fixed-variant": "#544600", "on-primary-fixed": "#00210c", "surface-container": "#edeeef",
                        "on-secondary": "#ffffff", "inverse-primary": "#93d6a0", "surface-tint": "#2a6a3f", "primary": "#003215",
                        "tertiary-container": "#860015", "error-container": "#ffdad6", "surface-dim": "#d9dadb",
                        "primary-fixed-dim": "#93d6a0", "on-secondary-container": "#6e5c00", "surface-container-lowest": "#ffffff",
                        "surface": "#f8f9fa", "on-tertiary-container": "#ff8a86", "tertiary": "#5c000b", "surface-variant": "#e1e3e4",
                        "surface-bright": "#f8f9fa", "on-primary": "#ffffff", "secondary-container": "#fcd400", "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#221b00", "inverse-surface": "#2e3132", "secondary": "#705d00", "on-surface": "#191c1d",
                        "surface-container-highest": "#e1e3e4", "outline-variant": "#c0c9be", "on-tertiary-fixed": "#410005",
                        "inverse-on-surface": "#f0f1f2", "secondary-fixed": "#ffe16d", "primary-fixed": "#aef2bb",
                        "on-primary-fixed-variant": "#0b5229", "on-error-container": "#93000a", "secondary-fixed-dim": "#e9c400",
                        "on-background": "#191c1d", "on-surface-variant": "#404941", "background": "#f8f9fa", "primary-container": "#004b23",
                        "tertiary-fixed-dim": "#ffb3af", "on-tertiary-fixed-variant": "#930018", "surface-container-high": "#e7e8e9",
                        "surface-container-low": "#f3f4f5", "outline": "#707970", "on-error": "#ffffff"
                    },
                    borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
                    spacing: { gutter: "12px", unit: "4px", "stack-lg": "48px", "stack-sm": "8px", "stack-md": "24px", "container-margin": "20px" },
                    fontFamily: { "title-md": ["Hanken Grotesk"], "display-lg": ["Anton"], "body-sm": ["Hanken Grotesk"], "headline-lg-mobile": ["Anton"], "headline-lg": ["Anton"], "label-caps": ["JetBrains Mono"], "body-lg": ["Hanken Grotesk"] },
                    fontSize: { "title-md": ["20px", { lineHeight: "1.4", fontWeight: "700" }], "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "0.02em", fontWeight: "400" }], "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }], "headline-lg-mobile": ["28px", { lineHeight: "1.2", fontWeight: "400" }], "headline-lg": ["32px", { lineHeight: "1.2", letterSpacing: "0.02em", fontWeight: "400" }], "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "600" }], "body-lg": ["16px", { lineHeight: "1.6", fontWeight: "400" }] }
                }
            }
        }
    </script>
</head>

<body class="bg-background text-on-surface min-h-screen pb-28">

    <header class="w-full top-0 sticky z-40 bg-surface border-b-2 border-outline-variant">
        <div class="flex justify-between items-center px-container-margin py-stack-sm w-full">
            <div class="flex items-center gap-4">
                <button id="menuBtn" class="text-primary hover:opacity-80 transition-opacity" onclick="window.openSidebar()">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Mercado da Copa</h1>
            </div>
            <button class="text-primary hover:opacity-80">
                <span class="material-symbols-outlined">notifications</span>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-container-margin py-stack-md">
        <div class="mb-stack-md">
            <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary uppercase tracking-tight">Histórico
                de Pedidos</h2>
            <p class="font-body-sm text-on-surface-variant">Acompanhe seus pedidos e relíquias adquiridas.</p>
        </div>

        <!-- Filtros de Status -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-stack-md pb-2">
            <button data-status="todos"
                class="status-filter px-4 py-2 border-2 border-primary bg-primary text-on-primary font-label-caps text-label-caps tactile-push">TODOS</button>
            <button data-status="processando"
                class="status-filter px-4 py-2 border-2 border-outline text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-container-high tactile-push">PROCESSANDO</button>
            <button data-status="enviado"
                class="status-filter px-4 py-2 border-2 border-outline text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-container-high tactile-push">ENVIADO</button>
            <button data-status="entregue"
                class="status-filter px-4 py-2 border-2 border-outline text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-container-high tactile-push">ENTREGUE</button>
            <button data-status="cancelado"
                class="status-filter px-4 py-2 border-2 border-outline text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-container-high tactile-push">CANCELADO</button>
        </div>

        <!-- Lista de Pedidos -->
        <div id="pedidosList" class="space-y-4">
            <div class="text-center py-10 text-on-surface-variant">📦 Carregando seus pedidos...</div>
        </div>

        <!-- Mensagem se vazio -->
        <div id="emptyOrders" class="hidden flex-col items-center justify-center py-20 text-center">
            <span class="material-symbols-outlined text-surface-variant text-[80px] mb-4">receipt_long</span>
            <h3 class="font-headline-lg-mobile text-primary">Nenhum pedido ainda</h3>
            <p class="text-on-surface-variant mb-stack-md">Seu histórico de glórias começa aqui.</p>
            <button onclick="location.href='telaprincipal.html'"
                class="bg-primary text-on-primary px-6 py-3 rounded-xl neobrutal-shadow tactile-push">EXPLORAR
                ACERVO</button>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full z-50 bg-surface border-t-2 border-outline-variant">
        <div class="flex justify-around items-center w-full px-2 py-3">
            <a href="telaprincipal.html"
                class="flex flex-col items-center justify-center text-on-surface-variant p-2"><span
                    class="material-symbols-outlined">home</span><span
                    class="font-label-caps text-label-caps mt-1">Home</span></a>
            <a href="telaprincipal.html"
                class="flex flex-col items-center justify-center text-on-surface-variant p-2"><span
                    class="material-symbols-outlined">search</span><span
                    class="font-label-caps text-label-caps mt-1">Search</span></a>
            <a href="publicaritens.html"
                class="flex flex-col items-center justify-center text-on-surface-variant p-2"><span
                    class="material-symbols-outlined">add_circle</span><span
                    class="font-label-caps text-label-caps mt-1">Sell</span></a>
            <a href="carrinho.html" class="flex flex-col items-center justify-center text-on-surface-variant p-2"><span
                    class="material-symbols-outlined">shopping_cart</span><span
                    class="font-label-caps text-label-caps mt-1">Cart</span></a>
            <a href="perfil.html"
                class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2"><span
                    class="material-symbols-outlined" style="font-variation-settings:'FILL'1;">person</span><span
                    class="font-label-caps text-label-caps mt-1">Profile</span></a>
        </div>
    </nav>

    <script type="module">
        import { getToken, getPedidos } from './js/api.js';

        const API_BASE_URL = window.API_BASE_URL || "http://localhost:3000";

        let currentStatus = "todos";
        let pedidos = [];

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function checkAuth() {
            const token = getToken();
            if (!token) {
                showToast('🔐 Faça login para ver seu histórico!');
                setTimeout(() => {
                    window.location.href = 'acesso.html';
                }, 1500);
                return false;
            }
            return true;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR');
        }

        function getStatusBadge(status) {
            const statusConfig = {
                'processando': { icon: 'pending', text: 'PROCESSANDO', bg: 'bg-tertiary-container text-on-tertiary-container' },
                'enviado': { icon: 'local_shipping', text: 'ENVIADO', bg: 'bg-secondary-container text-on-secondary-container' },
                'entregue': { icon: 'check_circle', text: 'ENTREGUE', bg: 'bg-primary-container text-on-primary-container' },
                'cancelado': { icon: 'cancel', text: 'CANCELADO', bg: 'bg-error-container text-error' }
            };
            const config = statusConfig[status] || statusConfig['processando'];
            return `<span class="${config.bg} px-3 py-1 rounded-full font-label-caps text-[10px] flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">${config.icon}</span> ${config.text}
                    </span>`;
        }

        async function carregarPedidos() {
            const token = getToken();
            if (!token) return;

            const container = document.getElementById('pedidosList');
            container.innerHTML = '<div class="text-center py-10 text-on-surface-variant">📦 Carregando seus pedidos...</div>';

            try {
                const data = await getPedidos(token);

                if (data.error) {
                    container.innerHTML = `<div class="text-center py-10 text-error">❌ ${data.error}</div>`;
                    return;
                }

                pedidos = data;
                renderPedidos();

            } catch (err) {
                console.error('Erro:', err);
                container.innerHTML = '<div class="text-center py-10 text-error">❌ Erro ao carregar pedidos. Tente novamente mais tarde.</div>';
            }
        }

        function renderPedidos() {
            const container = document.getElementById('pedidosList');
            const emptyDiv = document.getElementById('emptyOrders');

            let filtered = pedidos;
            if (currentStatus !== 'todos') {
                filtered = pedidos.filter(p => p.status === currentStatus);
            }

            if (filtered.length === 0) {
                container.classList.add('hidden');
                emptyDiv.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            emptyDiv.classList.add('hidden');

            container.innerHTML = filtered.map(pedido => `
                <div class="bg-surface border-2 border-outline-variant rounded-xl overflow-hidden hover:border-primary transition-all">
                    <div class="p-4 border-b-2 border-outline-variant bg-surface-container-low flex justify-between items-center">
                        <div>
                            <span class="font-label-caps text-label-caps text-primary">PEDIDO #${pedido.id?.slice(-8)?.toUpperCase() || 'MC-' + pedido.numero}</span>
                            <p class="font-body-sm text-on-surface-variant">${formatDate(pedido.created_at)}</p>
                        </div>
                        ${getStatusBadge(pedido.status)}
                    </div>
                    <div class="p-4 space-y-3">
                        ${pedido.itens?.map(item => `
                            <div class="flex gap-3">
                                <div class="w-16 h-16 bg-surface-container-highest rounded-md overflow-hidden flex-shrink-0 border border-outline-variant">
                                    <img src="${item.produto?.imagem_url || 'https://placehold.co/400x500/e0e0e0/333?text=Item'}" class="w-full h-full object-cover" alt="${item.produto?.titulo}" onerror="this.src='https://placehold.co/400x500/e0e0e0/333?text=Item'">
                                </div>
                                <div class="flex-grow">
                                    <h3 class="font-title-md text-title-md leading-tight">${item.produto?.titulo || 'Produto'}</h3>
                                    <p class="font-label-caps text-label-caps text-outline">Tamanho ${item.produto?.tamanho || 'Único'} · ${item.quantidade} unidade(s)</p>
                                    <div class="flex justify-between items-center mt-2">
                                        <span class="font-headline-lg text-headline-lg-mobile text-primary">R$ ${(item.preco_unitario * item.quantidade).toLocaleString('pt-BR')}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('') || `
                            <div class="flex gap-3">
                                <div class="w-16 h-16 bg-surface-container-highest rounded-md overflow-hidden flex-shrink-0 border border-outline-variant">
                                    <img src="https://placehold.co/400x500/e0e0e0/333?text=Item" class="w-full h-full object-cover" alt="Item">
                                </div>
                                <div class="flex-grow">
                                    <h3 class="font-title-md text-title-md leading-tight">Produto</h3>
                                    <p class="font-label-caps text-label-caps text-outline">Detalhes do pedido</p>
                                    <div class="flex justify-between items-center mt-2">
                                        <span class="font-headline-lg text-headline-lg-mobile text-primary">R$ ${pedido.total?.toLocaleString('pt-BR') || '0,00'}</span>
                                    </div>
                                </div>
                            </div>
                        `}
                    </div>
                    <div class="p-4 border-t-2 border-outline-variant bg-surface-container-low">
                        <div class="flex justify-between items-center">
                            <span class="font-label-caps text-label-caps">Total do pedido: <strong class="text-primary">R$ ${pedido.total?.toLocaleString('pt-BR') || '0,00'}</strong></span>
                            ${pedido.status === 'entregue' ? `
                                <button onclick="avaliarPedido('${pedido.id}')" class="text-primary font-label-caps text-label-caps flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">rate_review</span> Avaliar
                                </button>
                            ` : ''}
                            ${pedido.status === 'enviado' && pedido.codigo_rastreio ? `
                                <button onclick="rastrearPedido('${pedido.codigo_rastreio}')" class="text-primary font-label-caps text-label-caps flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">track_changes</span> Rastrear
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.avaliarPedido = function(pedidoId) {
            showToast('⭐ Em breve você poderá avaliar seus pedidos!');
        };

        window.rastrearPedido = function(codigo) {
            showToast(`📦 Código de rastreio: ${codigo}`);
        };

        // Filtros
        document.querySelectorAll('.status-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.status-filter').forEach(b => {
                    b.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                    b.classList.add('border-outline', 'text-on-surface-variant');
                });
                btn.classList.add('bg-primary', 'text-on-primary', 'border-primary');
                btn.classList.remove('border-outline', 'text-on-surface-variant');
                currentStatus = btn.dataset.status;
                renderPedidos();
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (checkAuth()) {
                carregarPedidos();
            }
        });
    </script>
</body>
</html>
