<!DOCTYPE html>
<html class="light" lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Carrinho - Mercado da Copa</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;700&family=JetBrains+Mono:wght@600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script type="module" src="./js/api.js"></script>
  <script src="menu.js"></script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .active-state:active {
      transform: translate(2px, 2px);
      box-shadow: none !important;
    }

    .neobrutal-shadow {
      box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
    }

    body {
      min-height: max(884px, 100dvh);
      font-family: 'Hanken Grotesk', sans-serif;
    }

    .toast-message {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #003215;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      z-index: 1001;
      animation: fadeInOut 3s ease-in-out;
      box-shadow: 4px 4px 0px 0px #fcd400;
      border: 1px solid #fcd400;
      white-space: nowrap;
    }

    @keyframes fadeInOut {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }

      15% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      85% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px);
      }
    }
  </style>
</head>

<body class="bg-background text-on-surface min-h-screen flex flex-col">

  <header class="w-full top-0 sticky z-40 bg-surface border-b-2 border-outline-variant">
    <div class="flex justify-between items-center px-4 py-3 w-full">
      <button onclick="window.history.back()" class="text-primary"><span
          class="material-symbols-outlined">arrow_back</span></button>
      <h1 class="font-['Anton'] text-2xl text-primary tracking-tight">Mercado da Copa</h1>
      <button class="text-primary"><span class="material-symbols-outlined">notifications</span></button>
    </div>
  </header>

  <main class="flex-grow w-full max-w-[1200px] mx-auto px-4 py-6 pb-40">
    <div class="flex items-center justify-between mb-6">
      <h2 class="font-['Anton'] text-2xl text-gray-800 uppercase tracking-tight">Seu Carrinho</h2>
      <span id="cartItemCount" class="font-mono text-xs bg-secondary text-gray-800 px-3 py-1 rounded-xl">0 ITENS</span>
    </div>

    <div id="cart-container" class="space-y-3">
      <div id="cartItems"></div>
    </div>

    <div id="empty-cart" class="hidden flex-col items-center justify-center py-20 text-center">
      <span class="material-symbols-outlined text-gray-400 text-[80px] mb-4">shopping_bag</span>
      <h3 class="font-['Anton'] text-2xl text-primary">Seu carrinho está vazio</h3>
      <p class="text-gray-500 mb-6 max-w-xs">Parece que você ainda não escalou nenhum item para o seu time vintage.</p>
      <button onclick="location.href='telaprincipal.html'"
        class="bg-primary text-white font-mono text-xs py-3 px-8 rounded-xl">VOLTAR PARA A LOJA</button>
    </div>

    <div id="summarySection" class="mt-6 border-t-2 border-gray-200 pt-6 space-y-4 hidden">
      <div class="flex justify-between text-gray-600"><span>Subtotal</span><span id="subtotal">R$ 0,00</span></div>
      <div class="flex justify-between text-gray-600"><span>Frete</span><span
          class="text-primary font-bold">GRÁTIS</span></div>
      <div class="flex justify-between items-center py-2"><span
          class="font-['Anton'] text-2xl text-primary uppercase">Total</span><span id="total"
          class="font-['Anton'] text-2xl text-primary">R$ 0,00</span></div>
    </div>

    <div id="actionButton" class="mt-6 hidden">
      <button id="finalizarBtn"
        class="w-full bg-primary text-white font-bold py-6 rounded-xl flex items-center justify-center gap-3"
        onclick="window.location.href='pagamento.html'">
        FINALIZAR COMPRA <span class="material-symbols-outlined">sports_soccer</span>
      </button>
      <p class="text-center text-xs font-mono mt-4 text-gray-500">PAGAMENTO 100% SEGURO</p>
    </div>
  </main>

  <nav class="fixed bottom-0 w-full z-50 bg-white border-t-2 border-gray-200">
    <div class="flex justify-around items-center py-2">
      <a href="telaprincipal.html" class="flex flex-col items-center text-gray-500 p-2"><span
          class="material-symbols-outlined">home</span><span class="text-[10px] mt-1">Home</span></a>
      <a href="telaprincipal.html" class="flex flex-col items-center text-gray-500 p-2"><span
          class="material-symbols-outlined">search</span><span class="text-[10px] mt-1">Search</span></a>
      <a href="publicaritens.html" class="flex flex-col items-center text-gray-500 p-2"><span
          class="material-symbols-outlined">add_circle</span><span class="text-[10px] mt-1">Sell</span></a>
      <a href="carrinho.html" class="flex flex-col items-center bg-primary/10 text-primary rounded-xl p-2"><span
          class="material-symbols-outlined" style="font-variation-settings:'FILL'1;">shopping_cart</span><span
          class="text-[10px] mt-1">Cart</span></a>
      <a href="perfil.html" class="flex flex-col items-center text-gray-500 p-2"><span
          class="material-symbols-outlined">person</span><span class="text-[10px] mt-1">Profile</span></a>
    </div>
  </nav>

  <script type="module">
    import { getToken as getTokenApi, getCarrinho, atualizarItemCarrinho, removerItemCarrinho } from './js/api.js';
    const API_BASE_URL = window.API_BASE_URL || "http://localhost:3000";

    function getToken() {
      return getTokenApi();
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast-message';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    async function loadCart() {
      const token = getToken();
      if (!token) {
        document.getElementById('cartItems').innerHTML = `<p class="text-center py-8 font-bold">🔐 Faça login para visualizar seu carrinho.</p>`;
        return;
      }

      try {
        const data = await getCarrinho(token);

        if (data.error || !data.itens || data.itens.length === 0) {
          document.getElementById('cartItems').innerHTML = ''; // vazio
          document.getElementById('empty-cart').classList.remove('hidden');
          document.getElementById('summarySection').classList.add('hidden');
          document.getElementById('actionButton').classList.add('hidden');
          return;
        }

        document.getElementById('empty-cart').classList.add('hidden');
        document.getElementById('summarySection').classList.remove('hidden');
        document.getElementById('actionButton').classList.remove('hidden');

        renderCartItems(data.itens);
        updateSummary(data.total);
        document.getElementById('cartItemCount').textContent = `${data.itens.length} ITENS`;
      } catch (err) {
        showToast('❌ Erro ao carregar carrinho');
      }
    }

    function renderCartItems(itens) {
      const container = document.getElementById('cartItems');
      if (!container) return;

      if (!itens || itens.length === 0) {
        container.innerHTML = `
      <div class="p-8 text-center border-2 border-dashed border-outline rounded-xl">
        <span class="material-symbols-outlined text-4xl text-outline mb-2">shopping_cart_off</span>
        <p class="font-bold text-lg">Seu carrinho está vazio</p>
        <p class="text-sm text-on-surface-variant mb-4">Adicione relíquias da vitrine para começar.</p>
        <a href="telaprincipal.html" class="inline-flex items-center gap-2 bg-primary text-on-primary font-mono text-xs uppercase tracking-widest px-4 py-2 border-2 border-black neobrutal-shadow active-state">
          Ir para a Vitrine
        </a>
      </div>
    `;
        // Esconde o card do resumo total se estiver vazio, evitando erros estéticos
        document.getElementById('cartSummaryCard')?.classList.add('hidden');
        return;
      }

      // Se houver itens, mostra o resumo
      document.getElementById('cartSummaryCard')?.classList.remove('hidden');

      container.innerHTML = itens.map(item => `
    <div class="border-2 border-black p-4 bg-surface rounded-xl flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between neobrutal-shadow">
      <div class="flex gap-4 items-center flex-1">
        <img src="${item.produto.imagem_url || 'https://via.placeholder.com/80'}" alt="${item.produto.titulo}" class="w-20 h-20 object-cover border-2 border-black rounded-lg bg-gray-100 flex-shrink-0" />
        <div>
          <span class="font-mono text-[10px] uppercase tracking-widest bg-secondary-container text-on-secondary-container px-2 py-0.5 border border-black rounded-full">${item.produto.categoria}</span>
          <h3 class="font-bold text-lg mt-1 leading-tight">${item.produto.titulo}</h3>
          <p class="font-mono text-xs text-on-surface-variant mt-0.5">Tamanho: ${item.produto.tamanho || 'Único'} | Seleção: ${item.produto.selecao}</p>
          <div class="font-['Anton'] text-xl text-primary mt-1">R$ ${item.produto.preco.toFixed(2).replace('.', ',')}</div>
        </div>
      </div>
      
      <div class="flex sm:flex-col items-center sm:items-end justify-between w-full sm:w-auto gap-4 pt-4 sm:pt-0 border-t sm:border-t-0 border-outline/20">
        <div class="flex items-center border-2 border-black bg-surface rounded-lg overflow-hidden">
          <button onclick="updateQuantity('${item.id}', ${item.quantidade - 1})" class="px-2 py-1 hover:bg-black/5 font-bold transition-colors">-</button>
          <span class="px-3 font-mono font-bold border-x-2 border-black bg-white">${item.quantidade}</span>
          <button onclick="updateQuantity('${item.id}', ${item.quantidade + 1})" class="px-2 py-1 hover:bg-black/5 font-bold transition-colors">+</button>
        </div>
        <button onclick="removeItem('${item.id}')" class="text-error hover:text-red-700 flex items-center gap-1 font-mono text-xs uppercase tracking-widest">
          <span class="material-symbols-outlined text-lg">delete</span> Remover
        </button>
      </div>
    </div>
  `).join('');
    }

    function updateSummary(total) {
      document.getElementById('subtotal').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
      document.getElementById('total').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    window.updateQuantity = async (itemId, novaQuantidade) => {
      if (novaQuantidade < 1) return;
      const token = getToken();
      try {
        const data = await atualizarItemCarrinho(token, itemId, novaQuantidade);
        if (data.error) return showToast('❌ ' + data.error);
        loadCart();
      } catch (err) {
        showToast('❌ Erro ao atualizar');
      }
    };

    window.removeItem = async (itemId) => {
      if (!confirm('Remover este item do carrinho?')) return;
      const token = getToken();
      try {
        const data = await removerItemCarrinho(token, itemId);
        if (data.error) return showToast('❌ ' + data.error);
        showToast('🗑️ Item removido!');
        loadCart();
      } catch (err) {
        showToast('❌ Erro ao remover');
      }
    };

    document.addEventListener('DOMContentLoaded', loadCart);

    document.getElementById('checkoutBtn')?.addEventListener('click', () => {
      if (!cartData || !cartData.itens || cartData.itens.length === 0) {
        showToast('❌ Seu carrinho está vazio!');
        return;
      }
      // Preserva os dados estruturados idênticos ao esperado pelo pagamento.html
      localStorage.setItem('mdc:checkout_data', JSON.stringify(cartData));
      window.location.href = 'pagamento.html';
    });
  </script>
</body>

</html>
