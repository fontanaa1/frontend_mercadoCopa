<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Propor Troca - Mercado da Copa</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;700&family=JetBrains+Mono:wght@600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script type="module" src="./js/api.js"></script>
    <script src="menu.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .tactile-push:active {
            transform: translate(2px, 2px);
            box-shadow: none !important;
        }

        body {
            min-height: max(884px, 100dvh);
            font-family: 'Hanken Grotesk', sans-serif;
        }

        .toast-message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #003215;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            z-index: 1001;
            animation: fadeInOut 3s ease-in-out;
            box-shadow: 4px 4px 0px 0px #fcd400;
            border: 1px solid #fcd400;
            white-space: nowrap;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen pb-28">

    <header class="w-full top-0 sticky z-40 bg-white border-b-2 border-gray-200">
        <div class="flex justify-between items-center px-4 py-3 w-full">
            <div class="flex items-center gap-4">
                <button id="menuBtn" class="text-primary" onclick="window.openSidebar()">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h1 class="font-['Anton'] text-2xl text-primary tracking-tight">Propor Troca</h1>
            </div>
            <button class="text-primary"><span class="material-symbols-outlined">swap_horiz</span></button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 space-y-6">

        <!-- Produto a Receber (Desejado) -->
        <div class="bg-white border-2 border-gray-200 rounded-xl p-4">
            <h3 class="font-mono text-xs text-primary mb-3">1. ITEM QUE VOCÊ VAI RECEBER</h3>
            <div id="availableItemsList" class="space-y-3">
                <div class="text-center py-4 text-gray-500">📦 Carregando item desejado...</div>
            </div>
        </div>

        <div class="flex justify-center">
            <span class="material-symbols-outlined text-4xl text-gray-400">swap_horiz</span>
        </div>

        <!-- Meus Produtos (para oferecer) -->
        <div class="bg-white border-2 border-gray-200 rounded-xl p-4">
            <h3 class="font-mono text-xs text-primary mb-3">2. SELECIONE O SEU ITEM PARA OFERECER</h3>
            <div id="meusProdutosList" class="space-y-3 max-h-80 overflow-y-auto">
                <div class="text-center py-4 text-gray-500">📦 Carregando seus produtos...</div>
            </div>
        </div>

        <div class="bg-white border-2 border-gray-200 rounded-xl p-4">
            <label class="font-mono text-xs text-primary">MENSAGEM PARA O VENDEDOR</label>
            <textarea id="mensagemTroca" rows="3"
                class="w-full mt-2 bg-transparent border-2 border-gray-200 rounded-lg p-2 focus:border-primary focus:outline-none"
                placeholder="Olá! Gostaria de propor uma troca..."></textarea>
        </div>

        <button id="enviarPropostaBtn"
            class="w-full bg-primary text-white py-4 rounded-xl font-bold uppercase flex items-center justify-center gap-2">
            <span class="material-symbols-outlined">send</span> ENVIAR PROPOSTA
        </button>

        <p class="text-center text-sm text-gray-500">Após enviar, o vendedor terá 48h para responder.</p>

    </main>

    <nav class="fixed bottom-0 w-full z-50 bg-white border-t-2 border-gray-200 flex justify-around items-center py-2">
        <a href="telaprincipal.html" class="flex flex-col items-center text-gray-500 p-2"><span
                class="material-symbols-outlined">home</span><span class="text-[10px] mt-1">Home</span></a>
        <a href="telaprincipal.html" class="flex flex-col items-center text-gray-500 p-2"><span
                class="material-symbols-outlined">search</span><span class="text-[10px] mt-1">Search</span></a>
        <a href="publicaritens.html" class="flex flex-col items-center text-gray-500 p-2"><span
                class="material-symbols-outlined">add_circle</span><span class="text-[10px] mt-1">Sell</span></a>
        <a href="carrinho.html" class="flex flex-col items-center text-gray-500 p-2"><span
                class="material-symbols-outlined">shopping_cart</span><span class="text-[10px] mt-1">Cart</span></a>
        <a href="perfil.html" class="flex flex-col items-center bg-primary/10 text-primary rounded-xl p-2"><span
                class="material-symbols-outlined" style="font-variation-settings:'FILL'1;">person</span><span
                class="text-[10px] mt-1">Profile</span></a>
    </nav>

    <script type="module">
        import { meusProdutos, proporTroca, getUser, getToken, carregarProdutoPorId } from './js/api.js';

        const API_BASE_URL = window.API_BASE_URL || "http://localhost:3000";

        let meusProdutosList = [];
        let targetItem = null;
        let selectedMyItemId = null;
        let selectedTargetItemId = null;

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Verificar autenticação
        const token = getToken();
        if (!token) {
            showToast('🔐 Faça login para propor troca!');
            setTimeout(() => { window.location.href = 'acesso.html'; }, 1500);
        }

        function renderMyItems() {
            const container = document.getElementById('meusProdutosList');
            if (!container) return;
            container.innerHTML = meusProdutosList.map(produto => `
                <div class="flex gap-3 p-3 border-2 ${selectedMyItemId === produto.id ? 'border-primary bg-primary/5' : 'border-gray-200'} rounded-lg hover:border-primary cursor-pointer transition-all" onclick="selectMyItem('${produto.id}')">
                    <div class="w-16 h-16 bg-gray-100 rounded overflow-hidden flex-shrink-0">
                        <img src="${produto.imagem_url || 'https://placehold.co/400x500/e0e0e0/333?text=Item'}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x500/e0e0e0/333?text=Item'">
                    </div>
                    <div class="flex-grow">
                        <h4 class="font-bold text-sm">${produto.titulo}</h4>
                        <p class="text-xs text-gray-500">R$ ${produto.preco || '0'} · Tamanho: ${produto.tamanho || 'Único'}</p>
                    </div>
                    <input type="radio" name="myItem" ${selectedMyItemId === produto.id ? 'checked' : ''} class="w-5 h-5 accent-primary">
                </div>
            `).join('');
        }

        // Carregar MEUS produtos (para oferecer)
        async function loadMyItems() {
            const token = getToken();
            if (!token) {
                showToast('🔐 Faça login para ver seus itens!');
                return;
            }

            try {
                console.log('Buscando meus produtos disponíveis para troca...');
                const myItems = await meusProdutos(token);

                if (myItems.error) {
                    console.error('Erro retornado pela API:', myItems.error);
                    return;
                }

                // QUALQUER item que o usuário já publicou
                meusProdutosList = myItems;

                if (meusProdutosList.length === 0) {
                    document.getElementById('meusProdutosList').innerHTML = '<div class="text-center py-4 text-gray-500">📦 Nenhum item seu encontrado para oferecer. Crie um item primeiro!</div>';
                    return;
                }

                renderMyItems();

            } catch (err) {
                console.error('Erro ao carregar meus itens:', err);
                showToast('❌ Erro ao carregar seus produtos para troca');
            }
        }

        // Carregar o produto que eu quero receber (especificado no URL ?id=...)
        async function loadTargetItem() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');
            if (!targetId) {
                document.getElementById('availableItemsList').innerHTML = '<div class="text-center py-4 text-red-500">⚠️ Nenhum item foi selecionado para troca!</div>';
                return;
            }

            try {
                console.log('Carregando item desejado para a troca:', targetId);
                const produto = await carregarProdutoPorId(targetId);

                if (produto.error) {
                    document.getElementById('availableItemsList').innerHTML = `<div class="text-center py-4 text-red-500">❌ ${produto.error}</div>`;
                    return;
                }

                targetItem = produto;
                selectedTargetItemId = produto.id;

                const container = document.getElementById('availableItemsList');
                const vendedorNome = produto.usuario?.raw_user_meta_data?.nome || produto.usuario?.email?.split('@')[0] || 'Vendedor';
                
                container.innerHTML = `
                    <div class="flex gap-3 p-3 border-2 border-primary bg-primary/5 rounded-lg">
                        <div class="w-16 h-16 bg-gray-100 rounded overflow-hidden flex-shrink-0">
                            <img src="${produto.imagem_url || 'https://placehold.co/400x500/e0e0e0/333?text=Item'}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x500/e0e0e0/333?text=Item'">
                        </div>
                        <div class="flex-grow">
                            <h4 class="font-bold text-sm">${produto.titulo}</h4>
                            <p class="text-xs text-gray-500">R$ ${produto.preco} · Vendedor: ${vendedorNome}</p>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error('Erro ao carregar item de destino:', err);
                document.getElementById('availableItemsList').innerHTML = '<div class="text-center py-4 text-red-500">❌ Erro ao carregar o item desejado</div>';
            }
        }

        window.selectMyItem = (id) => {
            selectedMyItemId = id;
            renderMyItems();
            console.log('Item selecionado para oferecer:', selectedMyItemId);
        };

        async function enviarProposta() {
            if (!getToken()) {
                showToast('🔐 Faça login para propor troca!');
                setTimeout(() => { window.location.href = 'acesso.html'; }, 1500);
                return;
            }

            if (!selectedMyItemId) {
                showToast('⚠️ Selecione um item seu para oferecer!');
                return;
            }

            if (!selectedTargetItemId || !targetItem) {
                showToast('⚠️ Erro ao carregar o item desejado!');
                return;
            }

            const myItem = meusProdutosList.find(p => p.id === selectedMyItemId);

            if (!myItem) {
                showToast('❌ Erro ao identificar o item selecionado');
                return;
            }

            const mensagem = document.getElementById('mensagemTroca').value;

            console.log('Enviando proposta:', {
                receptor_id: targetItem.usuario_id,
                produto_solicitante_id: myItem.id,
                produto_receptor_id: targetItem.id,
                mensagem: mensagem
            });

            const result = await proporTroca(token, {
                receptor_id: targetItem.usuario_id,
                produto_solicitante_id: myItem.id,
                produto_receptor_id: targetItem.id,
                mensagem: mensagem
            });

            if (result.error) {
                showToast('❌ ' + result.error);
                console.error('Erro na proposta:', result.error);
            } else {
                showToast('✅ Proposta de troca enviada com sucesso!');
                console.log('Proposta enviada:', result);
                setTimeout(() => { window.location.href = 'telaprincipal.html'; }, 1500);
            }
        }

        document.getElementById('enviarPropostaBtn')?.addEventListener('click', enviarProposta);

        document.addEventListener('DOMContentLoaded', () => {
            console.log('Página de troca carregada');
            loadMyItems();
            loadTargetItem();
        });
    </script>
</body>

</html>
