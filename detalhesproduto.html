<!DOCTYPE html>
<html class="light" lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Detalhes - Mercado da Copa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Hanken+Grotesk:wght@400;700&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script type="module" src="./js/api.js"></script>
<script src="menu.js"></script>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .tactile-press:active { transform: translate(2px, 2px); box-shadow: none !important; }
    body { min-height: max(884px, 100dvh); font-family: 'Hanken Grotesk', sans-serif; }
    .toast-message {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: #003215; color: white; padding: 12px 24px; border-radius: 50px;
      font-family: 'JetBrains Mono', monospace; font-size: 12px; z-index: 1001;
      animation: fadeInOut 3s ease-in-out; box-shadow: 4px 4px 0px 0px #fcd400;
      border: 1px solid #fcd400; white-space: nowrap;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }
</style>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#003215", "primary-container": "#004b23", "surface": "#f8f9fa",
                    "outline": "#707970", "outline-variant": "#c0c9be", "on-surface": "#191c1d",
                    "on-surface-variant": "#404941", "secondary-container": "#fcd400", "tertiary": "#5c000b",
                    "background": "#f8f9fa", "secondary": "#705d00"
                },
                borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
                spacing: { gutter: "12px", "container-margin": "20px", "stack-lg": "48px", "stack-md": "24px", "stack-sm": "8px", unit: "4px" },
                fontFamily: { "headline-lg": ["Anton"], "title-md": ["Hanken Grotesk"], "display-lg": ["Anton"], "body-lg": ["Hanken Grotesk"], "headline-lg-mobile": ["Anton"], "body-sm": ["Hanken Grotesk"], "label-caps": ["JetBrains Mono"] },
                fontSize: { "headline-lg": ["32px", { lineHeight: "1.2", letterSpacing: "0.02em", fontWeight: "400" }], "title-md": ["20px", { lineHeight: "1.4", fontWeight: "700" }], "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "0.02em", fontWeight: "400" }], "body-lg": ["16px", { lineHeight: "1.6", fontWeight: "400" }], "headline-lg-mobile": ["28px", { lineHeight: "1.2", fontWeight: "400" }], "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }], "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "600" }] }
            }
        }
    }
</script>
</head>
<body class="bg-background text-on-background font-body-lg min-h-screen pb-32">
<header class="w-full top-0 sticky bg-surface border-b-2 border-outline-variant z-50">
    <div class="flex justify-between items-center px-4 py-3 w-full">
        <button onclick="window.history.back()" class="text-primary"><span class="material-symbols-outlined">arrow_back</span></button>
        <h1 class="font-['Anton'] text-2xl text-primary tracking-tight">Mercado da Copa</h1>
        <a href="carrinho.html" class="relative">
            <span class="material-symbols-outlined text-primary">shopping_cart</span>
        </a>
    </div>
</header>
<main class="max-w-[1200px] mx-auto">
    <section class="relative w-full aspect-[4/5] md:aspect-video overflow-hidden">
        <img id="produtoImagem" alt="Produto" class="w-full h-full object-cover" src=""/>
    </section>
    <section class="px-4 -mt-12 relative z-20">
        <div class="bg-white border-2 border-gray-200 p-6 rounded-xl shadow-sm">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span id="categoriaBadge" class="font-mono text-xs text-secondary uppercase mb-2 block">Carregando...</span>
                    <h2 id="produtoTitulo" class="font-['Anton'] text-3xl text-gray-800 mb-1">Carregando...</h2>
                </div>
                <div class="bg-primary px-3 py-1 rounded-sm">
                    <span id="produtoPreco" class="font-['Anton'] text-2xl text-white">R$ 0</span>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 my-4">
                <div class="border-2 border-gray-200 p-3 rounded-lg text-center bg-gray-50">
                    <span class="font-mono text-xs text-gray-500 uppercase">Condição</span>
                    <span id="produtoEstado" class="block font-bold text-primary mt-1">-</span>
                </div>
                <div class="border-2 border-gray-200 p-3 rounded-lg text-center bg-gray-50">
                    <span class="font-mono text-xs text-gray-500 uppercase">Tamanho</span>
                    <span id="produtoTamanho" class="block font-['Anton'] text-2xl text-gray-800 mt-1">-</span>
                </div>
            </div>
            <div class="mb-6">
                <h3 class="font-mono text-xs text-gray-500 mb-2 uppercase border-b border-gray-200 pb-2">Descrição</h3>
                <p id="produtoDescricao" class="text-gray-600 leading-relaxed">Carregando...</p>
            </div>
            <div class="flex gap-2 mb-4">
                <span id="ofertaBadge" class="bg-primary/10 text-primary border border-primary px-3 py-1 rounded-full text-xs font-mono">Venda</span>
                <span id="vendedorInfo" class="bg-secondary/20 text-secondary border border-secondary px-3 py-1 rounded-full text-xs font-mono">Vendedor</span>
            </div>
            <div class="flex flex-col gap-3">
                <button id="addToCartBtn" class="w-full bg-primary text-white py-3 px-4 rounded-lg font-bold flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    Adicionar ao Carrinho
                </button>
                <button id="trocarBtn" class="w-full bg-gray-100 border-2 border-primary text-primary py-3 px-4 rounded-lg font-bold flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">published_with_changes</span>
                    Propor Troca
                </button>
            </div>
        </div>
    </section>
</main>
<nav class="fixed bottom-0 w-full z-50 bg-white border-t-2 border-gray-200">
    <div class="flex justify-around items-center py-2">
        <a href="telaprincipal.html" class="flex flex-col items-center text-gray-500 p-2"><span class="material-symbols-outlined">home</span><span class="text-[10px] mt-1">Home</span></a>
        <a href="telaprincipal.html" class="flex flex-col items-center text-gray-500 p-2"><span class="material-symbols-outlined">search</span><span class="text-[10px] mt-1">Search</span></a>
        <a href="publicaritens.html" class="flex flex-col items-center text-gray-500 p-2"><span class="material-symbols-outlined">add_circle</span><span class="text-[10px] mt-1">Sell</span></a>
        <a href="carrinho.html" class="flex flex-col items-center text-gray-500 p-2"><span class="material-symbols-outlined">shopping_cart</span><span class="text-[10px] mt-1">Cart</span></a>
        <a href="perfil.html" class="flex flex-col items-center text-gray-500 p-2"><span class="material-symbols-outlined">person</span><span class="text-[10px] mt-1">Profile</span></a>
    </div>
</nav>

<script type="module">
    import { getToken as getTokenApi, carregarProdutoPorId, addToCart } from './js/api.js';
    const API_BASE_URL = window.API_BASE_URL || "http://localhost:3000";

    function getToken() { return getTokenApi(); }

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    let produtoAtual = null;

    async function carregarProduto() {
        const urlParams = new URLSearchParams(window.location.search);
        const produtoId = urlParams.get('id');
        if (!produtoId) {
            showToast('⚠️ Produto não especificado.');
            setTimeout(() => { window.location.href = 'telaprincipal.html'; }, 1500);
            return;
        }

        try {
            const produto = await carregarProdutoPorId(produtoId);

            if (produto.error) {
                showToast('❌ Produto não encontrado');
                setTimeout(() => { window.location.href = 'telaprincipal.html'; }, 1500);
                return;
            }

            produtoAtual = produto;

            // Preencher dados básicos
            document.getElementById('produtoTitulo').textContent = produto.titulo;
            document.getElementById('produtoPreco').textContent = `R$ ${produto.preco}`;
            document.getElementById('produtoDescricao').textContent = produto.descricao || 'Sem descrição disponível.';
            document.getElementById('produtoEstado').textContent = produto.estado || 'Excelente';
            document.getElementById('produtoTamanho').textContent = produto.tamanho || 'Único';
            document.getElementById('categoriaBadge').textContent = produto.categoria?.toUpperCase() || 'ITEM';
            document.getElementById('produtoImagem').src = produto.imagem_url || 'https://placehold.co/400x500/e0e0e0/333?text=Imagem';
            
            // Badge de oferta (venda ou troca)
            const ofertaBadge = document.getElementById('ofertaBadge');
            if (produto.tipo_oferta === 'troca') {
                ofertaBadge.innerHTML = '<span class="material-symbols-outlined text-[14px]">swap_horiz</span> ACEITA TROCA';
                ofertaBadge.classList.add('bg-secondary-container', 'text-on-secondary-container');
                // Desabilita o botão de compra para itens exclusivos de troca
                const addBtn = document.getElementById('addToCartBtn');
                addBtn.disabled = true;
                addBtn.innerHTML = '<span class="material-symbols-outlined">swap_horiz</span> APENAS TROCA';
                addBtn.classList.add('opacity-50', 'cursor-not-allowed', 'bg-gray-400');
            } else {
                ofertaBadge.innerHTML = '<span class="material-symbols-outlined text-[14px]">sell</span> VENDA';
                ofertaBadge.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                // Garante que o botão esteja ativo
                const addBtn = document.getElementById('addToCartBtn');
                addBtn.disabled = false;
                addBtn.innerHTML = '<span class="material-symbols-outlined">shopping_cart</span> Adicionar ao Carrinho';
                addBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-gray-400');
            }

            // Nome do vendedor
            const vendedorNome = produto.usuario?.raw_user_meta_data?.nome || produto.usuario?.email?.split('@')[0] || 'Vendedor';
            document.getElementById('vendedorInfo').innerHTML = `<span class="material-symbols-outlined text-[14px]">person</span> ${vendedorNome}`;

        } catch (err) {
            console.error('Erro:', err);
            showToast('❌ Erro ao carregar produto');
            setTimeout(() => { window.location.href = 'telaprincipal.html'; }, 1500);
        }
    }

    async function adicionarAoCarrinho() {
        const token = getToken();
        if (!token) {
            showToast('🔐 Faça login para adicionar ao carrinho!');
            setTimeout(() => { window.location.href = 'acesso.html'; }, 1500);
            return;
        }

        // Verifica se o botão está desabilitado (caso de troca)
        const addBtn = document.getElementById('addToCartBtn');
        if (addBtn.disabled) {
            showToast('⚠️ Este item é apenas para troca.');
            return;
        }

        if (!produtoAtual) return;

        try {
            const res = await addToCart(token, produtoAtual.id, 1);

            if (!res.error) {
                const btn = document.getElementById('addToCartBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="material-symbols-outlined">check</span> Adicionado!';
                btn.classList.replace('bg-primary', 'bg-green-600');
                setTimeout(() => {
                     btn.innerHTML = originalText;
                     btn.classList.replace('bg-green-600', 'bg-primary');
                }, 2000);
                showToast('✅ Produto adicionado ao carrinho!');
            } else {
                showToast('❌ Erro: ' + (res.error || 'Tente novamente'));
            }
        } catch (err) {
            showToast('❌ Erro ao adicionar ao carrinho');
        }
    }

    document.getElementById('addToCartBtn')?.addEventListener('click', adicionarAoCarrinho);
    document.getElementById('trocarBtn')?.addEventListener('click', () => {
        const token = getToken();
        if (!token) {
            showToast('🔐 Faça login para propor troca!');
            setTimeout(() => { window.location.href = 'acesso.html'; }, 1500);
            return;
        }
        window.location.href = `troca.html?id=${produtoAtual?.id}`;
    });

    document.addEventListener('DOMContentLoaded', carregarProduto);
</script>
</body>
</html>
